<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">环形缓冲区的物理槽位和逻辑顺序</title>
  <desc id="desc">五个物理槽位中，逻辑队列 B、C、D、E 从索引 2 开始，跨过末端后回到索引 0；索引 1 为空。</desc>
  <rect width="960" height="300" rx="18" fill="#f7f8fa"/>
  <text x="48" y="48" font-family="sans-serif" font-size="23" font-weight="700" fill="#243247">物理槽位（容量 = 5）</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g font-size="17" fill="#526174">
      <text x="150" y="91">索引 0</text><text x="294" y="91">索引 1</text><text x="438" y="91">索引 2</text><text x="582" y="91">索引 3</text><text x="726" y="91">索引 4</text>
    </g>
    <g stroke="#40516a" stroke-width="2">
      <rect x="92" y="108" width="116" height="70" rx="10" fill="#bfe6d0"/><rect x="236" y="108" width="116" height="70" rx="10" fill="#ffffff"/><rect x="380" y="108" width="116" height="70" rx="10" fill="#bfe6d0"/><rect x="524" y="108" width="116" height="70" rx="10" fill="#bfe6d0"/><rect x="668" y="108" width="116" height="70" rx="10" fill="#bfe6d0"/>
    </g>
    <g font-size="25" font-weight="700" fill="#183b2d"><text x="150" y="153">E</text><text x="438" y="153">B</text><text x="582" y="153">C</text><text x="726" y="153">D</text></g>
    <text x="294" y="153" font-size="20" fill="#8b96a5">空</text>
    <text x="438" y="207" font-size="17" font-weight="700" fill="#a13d38">head</text>
    <path d="M438 193 L438 178" stroke="#a13d38" stroke-width="3" marker-end="url(#arrowRed)"/>
    <text x="48" y="251" text-anchor="start" font-size="19" fill="#243247">逻辑顺序：B → C → D → E　　len = 4　　head = 2</text>
    <text x="48" y="279" text-anchor="start" font-size="16" fill="#526174">物理数组到末尾后回到索引 0；遍历按逻辑顺序产出，不按地址顺序。</text>
  </g>
  <defs><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a13d38"/></marker></defs>
</svg>
