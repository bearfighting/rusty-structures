<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc">
  <title id="title">AVL 左右双旋和左倾红黑树规则</title>
  <desc id="desc">左侧展示 AVL 的左右双旋将根 30、左孩子 10 和内侧孙节点 20 调整为根 20；右侧用红色边表示左倾红链接。</desc>
  <defs><style>text{font-family:sans-serif}.title{font-size:21px;font-weight:700;fill:#243247}.label{font-size:19px;fill:#243247}.small{font-size:15px;fill:#526174}.node{fill:#fff;stroke:#40516a;stroke-width:2}.rednode{fill:#fee2e2;stroke:#a13d38;stroke-width:2}.edge{stroke:#718096;stroke-width:2}.red{stroke:#b53e3e;stroke-width:4}</style></defs>
  <rect width="1000" height="485" rx="18" fill="#f7f8fa"/>
  <text x="35" y="42" class="title">AVL：左右失衡需要双旋</text>
  <text x="65" y="76" class="small">失衡</text><text x="360" y="76" class="small">左孩子左旋</text><text x="690" y="76" class="small">根右旋后</text>
  <g class="edge"><path d="M150 130 L105 205 M105 225 L155 295 M445 130 L400 205 M400 225 L355 295 M745 130 L700 205 M745 130 L790 205"/></g>
  <g><circle class="node" cx="150" cy="120" r="24"/><circle class="node" cx="105" cy="215" r="24"/><circle class="node" cx="155" cy="305" r="24"/><circle class="node" cx="445" cy="120" r="24"/><circle class="node" cx="400" cy="215" r="24"/><circle class="node" cx="355" cy="305" r="24"/><circle class="node" cx="745" cy="120" r="24"/><circle class="node" cx="700" cy="215" r="24"/><circle class="node" cx="790" cy="215" r="24"/></g>
  <g class="label" text-anchor="middle" dominant-baseline="central"><text x="150" y="120">30</text><text x="105" y="215">10</text><text x="155" y="305">20</text><text x="445" y="120">30</text><text x="400" y="215">20</text><text x="355" y="305">10</text><text x="745" y="120">20</text><text x="700" y="215">10</text><text x="790" y="215">30</text></g>
  <path d="M255 205 H315" stroke="#526174" stroke-width="2" marker-end="url(#arr)"/><path d="M555 205 H625" stroke="#526174" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M35 340 H965" stroke="#d4dae2" stroke-width="1.5"/>
  <text x="35" y="374" class="title">左倾红黑树：红链接只向左且不连续；根到空链接的黑高相同</text>
  <circle class="node" cx="180" cy="420" r="23"/><circle class="rednode" cx="115" cy="455" r="20"/><circle class="node" cx="245" cy="455" r="20"/>
  <path d="M166 437 L130 449" class="red"/><path d="M194 437 L230 449" class="edge"/>
  <text x="300" y="437" class="small">红色边表示红链接；它编码一个 3-node</text>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#526174"/></marker></defs>
</svg>
