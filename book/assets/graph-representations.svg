<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
  <title id="title">邻接表和邻接矩阵表示同一张图</title>
  <desc id="desc">无向图含节点 0 到 3 和边 0-1、0-2、1-3。左侧列出邻接表，右侧给出对称邻接矩阵。</desc>
  <defs><style>text{font-family:sans-serif}.title{font-size:21px;font-weight:700;fill:#243247}.node{fill:#e5f3eb;stroke:#40516a;stroke-width:2}.edge{stroke:#718096;stroke-width:2}.cell{fill:#fff;stroke:#718096;stroke-width:1.5}.hit{fill:#bfe6d0;stroke:#286a4b;stroke-width:1.5}.label{font-size:17px;fill:#243247}.small{font-size:14px;fill:#526174}</style></defs>
  <rect width="1000" height="350" rx="18" fill="#f7f8fa"/>
  <text x="35" y="38" class="title">示例无向图</text>
  <g class="edge"><path d="M100 115 L205 115 M100 115 L100 220 M205 115 L205 220"/></g>
  <g><circle class="node" cx="100" cy="115" r="24"/><circle class="node" cx="205" cy="115" r="24"/><circle class="node" cx="100" cy="220" r="24"/><circle class="node" cx="205" cy="220" r="24"/></g>
  <g class="label" text-anchor="middle" dominant-baseline="central"><text x="100" y="115">0</text><text x="205" y="115">1</text><text x="100" y="220">2</text><text x="205" y="220">3</text></g>
  <path d="M280 55 V300" stroke="#d4dae2" stroke-width="1.5"/>
  <text x="315" y="38" class="title">邻接表　O(V + E)</text>
  <g class="label"><text x="320" y="86">0 → [1, 2]</text><text x="320" y="126">1 → [0, 3]</text><text x="320" y="166">2 → [0]</text><text x="320" y="206">3 → [1]</text></g>
  <text x="315" y="258" class="small">只保存存在的邻接关系；适合稀疏图。</text>
  <path d="M530 55 V300" stroke="#d4dae2" stroke-width="1.5"/>
  <text x="570" y="38" class="title">邻接矩阵　O(V²)</text>
  <g class="small" text-anchor="middle"><text x="678" y="83">0</text><text x="728" y="83">1</text><text x="778" y="83">2</text><text x="828" y="83">3</text><text x="625" y="119">0</text><text x="625" y="159">1</text><text x="625" y="199">2</text><text x="625" y="239">3</text></g>
  <g><rect x="655" y="94" width="46" height="34" class="cell"/><rect x="705" y="94" width="46" height="34" class="hit"/><rect x="755" y="94" width="46" height="34" class="hit"/><rect x="805" y="94" width="46" height="34" class="cell"/>
  <rect x="655" y="134" width="46" height="34" class="hit"/><rect x="705" y="134" width="46" height="34" class="cell"/><rect x="755" y="134" width="46" height="34" class="cell"/><rect x="805" y="134" width="46" height="34" class="hit"/>
  <rect x="655" y="174" width="46" height="34" class="hit"/><rect x="705" y="174" width="46" height="34" class="cell"/><rect x="755" y="174" width="46" height="34" class="cell"/><rect x="805" y="174" width="46" height="34" class="cell"/>
  <rect x="655" y="214" width="46" height="34" class="cell"/><rect x="705" y="214" width="46" height="34" class="hit"/><rect x="755" y="214" width="46" height="34" class="cell"/><rect x="805" y="214" width="46" height="34" class="cell"/></g>
  <text x="570" y="284" class="small">查边 O(1)，但扫描邻居要看整行。</text>
</svg>
