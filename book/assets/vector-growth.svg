<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" role="img" aria-labelledby="title desc">
  <title id="title">Vector 追加触发扩容</title>
  <desc id="desc">左侧为长度和容量都是四的满缓冲区；追加 E 时申请八个槽位的新缓冲区，迁移 A 到 D，然后将 E 写入第五个位置。</desc>
  <defs>
    <style>
      .title { font: 700 27px sans-serif; fill: #172b4d; }
      .label { font: 600 18px sans-serif; fill: #344563; }
      .small { font: 16px sans-serif; fill: #5e6c84; }
      .slottext { font: 700 19px sans-serif; fill: #123b37; }
      .empty { font: 14px sans-serif; fill: #8993a4; }
      .step { font: 700 15px sans-serif; fill: #ffffff; }
      .slottext, .empty, .step { stroke: none; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#526d82"/>
    </marker>
  </defs>
  <rect width="1240" height="500" rx="22" fill="#f7f9fc"/>
  <text x="54" y="54" class="title">容量耗尽时：申请、迁移、写入</text>
  <rect x="52" y="91" width="500" height="355" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
  <rect x="688" y="91" width="500" height="355" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
  <circle cx="87" cy="128" r="18" fill="#2b6f83"/><text x="87" y="134" text-anchor="middle" class="step">1</text>
  <text x="118" y="135" class="label">追加前：len = capacity = 4</text>
  <circle cx="723" cy="128" r="18" fill="#2b6f83"/><text x="723" y="134" text-anchor="middle" class="step">2</text>
  <text x="754" y="135" class="label">追加后：len = 5，capacity ≥ 5</text>
  <text x="81" y="185" class="small">旧缓冲区已满；再写入一个值前必须先扩容。</text>
  <text x="717" y="185" class="small">新分配更大空间，搬移旧值，然后写入 E。</text>
  <g stroke="#ffffff" stroke-width="4" text-anchor="middle">
    <rect x="86" y="222" width="96" height="68" rx="10" fill="#b7e4d8"/>
    <rect x="184" y="222" width="96" height="68" rx="10" fill="#b7e4d8"/>
    <rect x="282" y="222" width="96" height="68" rx="10" fill="#b7e4d8"/>
    <rect x="380" y="222" width="96" height="68" rx="10" fill="#b7e4d8"/>
    <text x="134" y="264" class="slottext">A</text><text x="232" y="264" class="slottext">B</text>
    <text x="330" y="264" class="slottext">C</text><text x="428" y="264" class="slottext">D</text>
  </g>
  <text x="280" y="326" text-anchor="middle" class="small">旧缓冲区：4 个槽位</text>
  <path d="M510 256 C575 256, 615 256, 685 256" fill="none" stroke="#526d82" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="595" y="237" text-anchor="middle" class="small">分配并迁移</text>
  <g stroke="#ffffff" stroke-width="4" text-anchor="middle">
    <rect x="722" y="222" width="52" height="68" rx="9" fill="#b7e4d8"/>
    <rect x="776" y="222" width="52" height="68" rx="9" fill="#b7e4d8"/>
    <rect x="830" y="222" width="52" height="68" rx="9" fill="#b7e4d8"/>
    <rect x="884" y="222" width="52" height="68" rx="9" fill="#b7e4d8"/>
    <rect x="938" y="222" width="52" height="68" rx="9" fill="#f5c98b"/>
    <rect x="992" y="222" width="52" height="68" rx="9" fill="#e8edf4"/>
    <rect x="1046" y="222" width="52" height="68" rx="9" fill="#e8edf4"/>
    <rect x="1100" y="222" width="52" height="68" rx="9" fill="#e8edf4"/>
    <text x="748" y="263" class="slottext">A</text><text x="802" y="263" class="slottext">B</text>
    <text x="856" y="263" class="slottext">C</text><text x="910" y="263" class="slottext">D</text>
    <text x="964" y="263" class="slottext">E</text>
    <text x="1020" y="263" class="empty">空</text><text x="1074" y="263" class="empty">空</text>
    <text x="1128" y="263" class="empty">空</text>
  </g>
  <path d="M721 332 v14 H990 v-14" fill="none" stroke="#25806b" stroke-width="3"/>
  <text x="856" y="374" text-anchor="middle" class="label">已初始化的 5 个值</text>
  <path d="M721 393 v13 H1152 v-13" fill="none" stroke="#526d82" stroke-width="3"/>
  <text x="936" y="434" text-anchor="middle" class="label">新分配容量至少为 5</text>
</svg>
