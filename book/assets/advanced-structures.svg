<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">跳表、Bloom filter、BitSet 与 LRU 的核心状态</title>
  <desc id="desc">跳表以稀疏高层链接跳过节点；Bloom filter 多个哈希位置设置位；BitSet 用字中的位表示整数成员；LRU 链从最近使用端指向最久使用端。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#526174"/></marker><style>text{font-family:sans-serif}.title{font-size:18px;font-weight:700;fill:#243247}.node{fill:#e5f3eb;stroke:#40516a;stroke-width:2}.hot{fill:#fff2cc;stroke:#a47714;stroke-width:2}.line{stroke:#526174;stroke-width:2;fill:none;marker-end:url(#arrow)}.soft{stroke:#8a97a8;stroke-width:1.5;fill:none}.label{font-size:14px;fill:#243247}.small{font-size:12px;fill:#526174}</style></defs>
  <rect width="1000" height="390" rx="18" fill="#f7f8fa"/>
  <path d="M500 20 V370 M20 195 H980" stroke="#d4dae2" stroke-width="1.5"/>
  <text x="30" y="38" class="title">跳表：高层链接跨越多个节点</text>
  <g class="soft"><path d="M80 90 H190 H300 H410 H470"/><path d="M80 125 H140 H190 H250 H300 H360 H410 H470"/></g>
  <g><circle class="node" cx="80" cy="90" r="13"/><circle class="node" cx="190" cy="90" r="13"/><circle class="node" cx="300" cy="90" r="13"/><circle class="node" cx="410" cy="90" r="13"/><circle class="node" cx="80" cy="125" r="13"/><circle class="node" cx="140" cy="125" r="13"/><circle class="node" cx="190" cy="125" r="13"/><circle class="node" cx="250" cy="125" r="13"/><circle class="node" cx="300" cy="125" r="13"/><circle class="node" cx="360" cy="125" r="13"/><circle class="node" cx="410" cy="125" r="13"/><circle class="node" cx="470" cy="125" r="13"/></g>
  <text x="32" y="165" class="small">稀疏层用于跳跃；底层串起所有键。</text>
  <text x="530" y="38" class="title">Bloom filter：多位同时置 1</text>
  <g><rect x="550" y="86" width="42" height="42" class="node"/><rect x="592" y="86" width="42" height="42" class="hot"/><rect x="634" y="86" width="42" height="42" class="node"/><rect x="676" y="86" width="42" height="42" class="hot"/><rect x="718" y="86" width="42" height="42" class="node"/><rect x="760" y="86" width="42" height="42" class="hot"/><rect x="802" y="86" width="42" height="42" class="node"/><rect x="844" y="86" width="42" height="42" class="node"/><rect x="886" y="86" width="42" height="42" class="node"/></g>
  <g class="label" text-anchor="middle"><text x="571" y="112">0</text><text x="613" y="112">1</text><text x="655" y="112">0</text><text x="697" y="112">1</text><text x="739" y="112">0</text><text x="781" y="112">1</text><text x="823" y="112">0</text><text x="865" y="112">0</text><text x="907" y="112">0</text></g>
  <text x="530" y="165" class="small">查询所有目标位；全为 1 仍可能是误报。</text>
  <text x="30" y="230" class="title">BitSet：一个 u64 表示 64 个索引</text>
  <g><rect x="55" y="265" width="400" height="48" rx="7" fill="#fff" stroke="#718096" stroke-width="1.5"/><rect x="135" y="265" width="25" height="48" class="hot"/><rect x="435" y="265" width="20" height="48" class="hot"/></g>
  <g class="small" text-anchor="middle"><text x="67" y="334">0</text><text x="147" y="334">2</text><text x="430" y="334">63</text><text x="485" y="288">bit i → word i/64, offset i%64</text></g>
  <text x="530" y="230" class="title">LRU：最近使用 → 最久使用</text>
  <rect x="560" y="270" width="125" height="52" rx="9" class="hot"/><rect x="755" y="270" width="125" height="52" rx="9" class="node"/>
  <text x="622" y="301" text-anchor="middle" class="label">MRU: A</text><text x="817" y="301" text-anchor="middle" class="label">LRU: B</text>
  <path d="M685 296 H745" class="line"/>
  <text x="530" y="350" class="small">容量满时淘汰尾端 B；命中将节点移到头部。</text>
</svg>
